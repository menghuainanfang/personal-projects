name: ReadingOS Windows build
on:
  push:
    paths:
      - 'leisure/readingos/**'
      - '.github/workflows/readingos-windows.yml'
  pull_request:
    paths:
      - 'leisure/readingos/**'
      - '.github/workflows/readingos-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: leisure/readingos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: leisure/readingos/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: node node_modules/esbuild/install.js
      - run: npm test
      - run: npm run notices
      - run: npm run build
      - run: npm run test:desktop
      - run: npm run package
      - name: Test packaged application
        shell: pwsh
        run: |
          $env:READINGOS_EXECUTABLE = "$pwd\release\win-unpacked\ReadingOS.exe"
          npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ReadingOS-Windows-x64
          path: leisure/readingos/release/*setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results
          path: leisure/readingos/test-results/**/results.json
